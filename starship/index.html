<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#02050a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LoE Starship">
  <title>LoE: Starship Survivor</title>
  <link rel="manifest" href="manifest.json?v=9.9.11">
  <style>
    html,body{margin:0;min-height:100%;background:#02050a;color:#eaf5fb}
    body{min-height:100vh;min-height:100dvh}
    #boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#09131d 0,#040910 36%,#02050a 72%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;transition:opacity .22s ease}
    #boot.boot-out{opacity:0;pointer-events:none}
    .boot-inner{width:min(82vw,340px);text-align:center;padding:24px}
    .boot-brand{font-size:10px;font-weight:700;letter-spacing:.34em;color:#8296a6;margin-bottom:18px}
    .boot-mark{font-size:30px;line-height:1;color:#d9f3ff;text-shadow:0 0 22px rgba(157,224,255,.28);margin-bottom:14px}
    .boot-title{font-size:20px;font-weight:760;letter-spacing:.11em}
    .boot-sub{font-size:10px;letter-spacing:.29em;color:#8ca0b0;margin-top:7px}
    .boot-progress{display:flex;justify-content:center;gap:10px;margin-top:34px}
    .boot-node{font-size:15px;color:#31404b;transition:color .18s ease,text-shadow .18s ease}
    .boot-node.on{color:#d9f3ff;text-shadow:0 0 12px rgba(157,224,255,.42)}
    .boot-status{margin-top:12px;font-size:9px;font-weight:700;letter-spacing:.24em;color:#6f8596}
    .boot-detail{margin:16px auto 0;max-width:280px;font-size:11px;line-height:1.45;color:#ff9aaa;word-break:break-word}
    .boot-retry{margin-top:16px;border:1px solid #536775;border-radius:8px;background:#09131d;color:#eaf5fb;padding:9px 14px;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:.16em}
    .boot-retry[hidden],.boot-detail[hidden]{display:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-brand">LEGENDS OF EDEN</div>
      <div class="boot-mark">◇</div>
      <div class="boot-title">STARSHIP</div>
      <div class="boot-sub">SURVIVOR</div>
      <div class="boot-progress" aria-hidden="true">
        <span class="boot-node">◆</span><span class="boot-node">◆</span><span class="boot-node">◆</span><span class="boot-node">◆</span>
      </div>
      <div class="boot-status" id="bootStatus">CORE</div>
      <div class="boot-detail" id="bootDetail" hidden></div>
      <button class="boot-retry" id="bootRetry" type="button" hidden>REFRESH</button>
    </div>
  </div>
  <script>
  (function(){
    var root=document.getElementById('boot');
    var status=document.getElementById('bootStatus');
    var detail=document.getElementById('bootDetail');
    var retry=document.getElementById('bootRetry');
    var nodes=Array.prototype.slice.call(document.querySelectorAll('.boot-node'));
    var labels=['CORE','SYSTEMS','FOUNDATION','READY'];
    var finished=false;
    var watchdog=0;

    function stage(n){
      if(finished||!root)return;
      n=Math.max(0,Math.min(3,Number(n)||0));
      status.textContent=labels[n];
      nodes.forEach(function(node,i){node.classList.toggle('on',i<=n)});
    }

    function fail(err){
      if(finished||!root)return;
      window.clearTimeout(watchdog);
      status.textContent='LOAD ERROR';
      detail.hidden=false;
      retry.hidden=false;
      var message=err&&err.message?err.message:err;
      detail.textContent=String(message||'Startup failed.').slice(0,220);
    }

    function ready(){
      if(finished||!root)return;
      stage(3);
      finished=true;
      window.clearTimeout(watchdog);
      window.setTimeout(function(){
        if(!root)return;
        root.classList.add('boot-out');
        window.setTimeout(function(){if(root&&root.parentNode)root.parentNode.removeChild(root)},240);
      },80);
    }

    retry.addEventListener('click',function(){window.location.reload()});
    window.StarshipBoot={stage:stage,fail:fail,ready:ready};

    window.addEventListener('error',function(event){
      if(finished)return;
      var file=String(event.filename||'');
      if(file.indexOf('loader-v9.js')!==-1)fail(event.error||event.message||'Loader failed.');
    });

    window.addEventListener('unhandledrejection',function(event){
      if(!finished)fail(event.reason||'Startup promise rejected.');
    });

    watchdog=window.setTimeout(function(){
      if(finished||!root)return;
      status.textContent='STILL LOADING';
      detail.hidden=false;
      retry.hidden=false;
      detail.style.color='#8ca0b0';
      detail.textContent='Startup is taking longer than expected.';
    },30000);

    stage(0);
  })();
  </script>
  <script src="loader-v9.js?v=9.9.11" onerror="window.StarshipBoot&&window.StarshipBoot.fail('Loader unavailable.')"></script>
</body>
</html>
