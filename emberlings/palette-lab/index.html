<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Emberlings Palette Lab</title><style>:root{--bg:#0d1118;--p:#171d27;--p2:#222a37;--b:#364154;--t:#eef2f7;--m:#9da8b7;--g:#d9bb70}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b0f15,#111824);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.w{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 24px)}h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:var(--m);margin-bottom:10px}.row,.scroll{display:flex;gap:8px;align-items:center}.scroll{overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}button,input,select{font:inherit}button{min-height:42px;border:1px solid var(--b);background:var(--p2);color:var(--t);border-radius:11px;padding:8px 11px}button.on{outline:2px solid var(--g);background:#2b3444}.tab{white-space:nowrap;flex:0 0 auto}.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:10px;margin-bottom:10px}.preview{position:relative;aspect-ratio:1/1;max-height:390px;border:1px solid var(--b);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#283348,#111722 68%)}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:auto}.tint{position:absolute;inset:0;mix-blend-mode:color;opacity:.78;pointer-events:none}.fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.2}.sw{flex:1 0 62px;min-width:62px;padding:5px}.swc{height:34px;border-radius:8px;border:1px solid #ffffff20;margin-bottom:4px}.swn{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin:9px 0 5px}.field{display:flex;gap:7px}input[type=color]{width:60px;height:46px;border:1px solid var(--b);border-radius:10px;background:var(--p2);padding:2px}input[type=text],select{width:100%;min-height:44px;border:1px solid var(--b);border-radius:10px;background:var(--p2);color:var(--t);padding:9px;font-size:16px}input[type=range]{width:100%}.mats{display:flex;gap:6px;overflow-x:auto}.mats button{white-space:nowrap;flex:0 0 auto}.val{float:right;color:var(--t)}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{flex:1}.note{font-size:12px;color:var(--m)}.status{font-size:12px;color:#83d3a4;min-height:16px;margin-top:5px}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>Emberlings Palette + Scale Lab</h1><div class="sub">Phone lab. Tune all 8 palettes, materials, and the collectible Scale look.</div><div class="row"><button id="dragonTab" class="on">Dragon</button><button id="scaleTab">Scale</button><button id="export" style="margin-left:auto">Export JSON</button></div><div id="pals" class="scroll"></div><div class="grid"><section class="card"><div class="preview"><img id="art" src="dragon.webp"><div id="tint" class="tint"></div><div id="fx" class="fx"></div></div><div id="swatches" class="scroll"></div></section><section class="card"><div class="label">Palette name</div><input id="pname" type="text"><div class="label">Swatch name</div><input id="sname" type="text"><div class="label">Color</div><div class="field"><input id="color" type="color"><input id="hex" type="text" maxlength="7"></div><div class="label">Material</div><div id="mats" class="mats"></div><div class="label">Material strength <span id="mv" class="val"></span></div><input id="mr" type="range" min="0" max="100"><div class="label">Shade depth <span id="sv" class="val"></span></div><input id="sr" type="range" min="0" max="100"><div class="note">Lower shade depth = less muddy shadow. Material strength changes the preview effect only.</div><div class="actions"><button id="reset">Reset palette</button></div><div id="status" class="status"></div></section></div></div><script>const mats=['scale','gemstone','leather','metal','fur'];const names={scale:'Scale',gemstone:'Gemstone',leather:'Leather',metal:'Metal',fur:'Fur'};const defs={untuned:{name:'Untuned',s:[['Snow','#F4F4F1','scale'],['Pearl','#DBDBD6','scale'],['Silver','#BEBFBD','scale'],['Slate','#90938F','scale'],['Charcoal','#5A5D59','scale']]},nevari:{name:'Nevari',s:[['Green','#52704D','scale'],['Emerald','#19765A','gemstone'],['Leather','#75513A','leather'],['Bronze','#A07141','metal'],['Fur','#F0EEE7','fur']]},ashari:{name:'Ashari',s:[['Fire','#B94C34','scale'],['Ruby','#8F2E36','gemstone'],['Hide','#61392F','leather'],['Iron','#7B6358','metal'],['Ash Fur','#D9D0C7','fur']]},aaruian:{name:'Aaruian',s:[['Blue','#47779A','scale'],['Sapphire','#28648F','gemstone'],['Leather','#625044','leather'],['Silver','#A8B4BE','metal'],['Pearl Fur','#EAEFF2','fur']]},rakkan:{name:'Rakkan',s:[['Ochre','#AA6335','scale'],['Amber','#C3862D','gemstone'],['Leather','#704832','leather'],['Steel','#807B75','metal'],['Stone Fur','#D2C7BA','fur']]},elsari:{name:'Elsari',s:[['Violet','#74509B','scale'],['Amethyst','#865BB0','gemstone'],['Leather','#594356','leather'],['Chrome','#918B9D','metal'],['Pale Fur','#E9E1F2','fur']]},svarin:{name:'Svarin',s:[['Gold','#BE9B39','scale'],['Topaz','#D6A632','gemstone'],['Leather','#7B5E39','leather'],['Brass','#A98B4C','metal'],['Cream Fur','#F1E7CB','fur']]},olydran:{name:'Olydran',s:[['Ice','#CFDEE8','scale'],['Crystal','#A8D7EB','gemstone'],['Leather','#6E6A72','leather'],['Silver','#ABB5BD','metal'],['White Fur','#F7F8F6','fur']]}};function fresh(){let o={};for(const[k,p]of Object.entries(defs))o[k]={name:p.name,swatches:p.s.map(([name,color,material])=>({name,color,material,materialStrength:35,shadeStrength:12}))};return o}let state;try{state=JSON.parse(localStorage.getItem('emberPaletteLab'))||fresh()}catch{state=fresh()}let active='nevari',slot=0,mode='dragon';const $=x=>document.getElementById(x);function cur(){return state[active].swatches[slot]}function save(){localStorage.setItem('emberPaletteLab',JSON.stringify(state));$('status').textContent='Saved on this phone';setTimeout(()=>$('status').textContent='',700)}function render(){let p=$('pals');p.innerHTML='';Object.keys(state).forEach(id=>{let b=document.createElement('button');b.className='tab'+(id===active?' on':'');b.textContent=state[id].name;b.onclick=()=>{active=id;slot=0;render()};p.appendChild(b)});let sbox=$('swatches');sbox.innerHTML='';state[active].swatches.forEach((s,i)=>{let b=document.createElement('button');b.className='sw'+(i===slot?' on':'');b.innerHTML='<div class="swc"></div><div class="swn"></div>';b.querySelector('.swc').style.background=s.color;b.querySelector('.swn').textContent=s.name;b.onclick=()=>{slot=i;render()};sbox.appendChild(b)});let s=cur();$('pname').value=state[active].name;$('sname').value=s.name;$('color').value=s.color;$('hex').value=s.color;$('mr').value=s.materialStrength;$('sr').value=s.shadeStrength;$('mv').textContent=s.materialStrength+'%';$('sv').textContent=s.shadeStrength+'%';let mb=$('mats');mb.innerHTML='';mats.forEach(m=>{let b=document.createElement('button');b.className=s.material===m?'on':'';b.textContent=names[m];b.onclick=()=>{s.material=m;save();render()};mb.appendChild(b)});$('art').src=mode==='dragon'?'dragon.webp':'scale.webp';$('dragonTab').classList.toggle('on',mode==='dragon');$('scaleTab').classList.toggle('on',mode==='scale');apply()}function apply(){let s=cur(),t=$('tint'),f=$('fx');t.style.background=s.color;t.style.opacity=(.62+s.shadeStrength/250).toFixed(2);f.style.opacity=(s.materialStrength/100*.55).toFixed(2);if(s.material==='gemstone')f.style.background='linear-gradient(135deg,transparent 25%,#fff 42%,transparent 52%),radial-gradient(circle at 65% 30%,#fff,transparent 28%)';else if(s.material==='metal')f.style.background='linear-gradient(110deg,transparent 20%,#fff 40%,transparent 55%,#fff8 72%,transparent 82%)';else if(s.material==='leather')f.style.background='repeating-linear-gradient(25deg,#0000 0 5px,#0005 6px 7px)';else if(s.material==='fur')f.style.background='repeating-linear-gradient(75deg,#fff0 0 3px,#fff8 4px 5px)';else f.style.background='none'}$('dragonTab').onclick=()=>{mode='dragon';render()};$('scaleTab').onclick=()=>{mode='scale';render()};$('pname').oninput=e=>{state[active].name=e.target.value;save();render()};$('sname').oninput=e=>{cur().name=e.target.value;save();render()};$('color').oninput=e=>{cur().color=e.target.value.toUpperCase();save();render()};$('hex').onchange=e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9A-F]{6}$/i.test(v)){cur().color=v.toUpperCase();save();render()}else e.target.value=cur().color};$('mr').oninput=e=>{cur().materialStrength=+e.target.value;save();render()};$('sr').oninput=e=>{cur().shadeStrength=+e.target.value;save();render()};$('reset').onclick=()=>{state[active]=fresh()[active];slot=0;save();render()};$('export').onclick=async()=>{let text=JSON.stringify({format:'emberlings-palette-lab',schema:1,palettes:Object.entries(state).map(([id,p])=>({id,...p}))},null,2);try{if(navigator.share){await navigator.share({title:'Emberlings Palette Lab',text});return}}catch{}try{await navigator.clipboard.writeText(text);$('status').textContent='JSON copied. Paste it into ChatGPT.'}catch{prompt('Copy this JSON:',text)}};render();</script></body></html>
